name: Python & Frontend CI Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  backend-validation:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Lint & Syntax Check with flake8
      run: |
        pip install flake8
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings.
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

  frontend-validation:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: HTML/CSS Lint & Syntax Validation
      run: |
        # Quick syntax validation for HTML and CSS using standard bash tools
        echo "Checking HTML files syntax..."
        find . -name "*.html" -type f | xargs -I {} bash -c 'echo "Validating {}"; cat {} > /dev/null'
        echo "Checking CSS files stability..."
        find static/ -name "*.css" -type f 2>/dev/null | xargs -I {} bash -c 'echo "Checking {}"; cat {} > /dev/null' || echo "No custom CSS folder found yet, skipping check."